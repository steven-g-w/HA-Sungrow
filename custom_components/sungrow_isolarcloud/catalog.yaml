            Discharge: "187"
            Stop: "204"
      switches:
        - code: "10065"
          name: Forced charging
          on_value: "170"
          off_value: "85"
        - code: "10007"
          name: Active power limitation
          on_value: "170"
          off_value: "85"
          category: null
        - code: "10012"
          name: Feed-in power limitation
          on_value: "170"
          off_value: "85"
          category: null
      times:
        - key: forced_charging_1_start
          name: Forced charging 1 start
          hour_code: "10067"
          minute_code: "10068"
        - key: forced_charging_1_end
          name: Forced charging 1 end
          hour_code: "10069"
          minute_code: "10070"
        - key: forced_charging_2_start
          name: Forced charging 2 start
          hour_code: "10072"
          minute_code: "10073"
        - key: forced_charging_2_end
          name: Forced charging 2 end
          hour_code: "10074"
          minute_code: "10075"

