    # Writable parameters (paramSetting API), verified live
    # against a SH10RT hybrid inverter. Runtime still gates on
    # the enable_control option + paramSettingCheck + read-back.
    controls:
      numbers:
        - code: "10001"
          name: SOC upper limit
          min: 50
          max: 100
          step: 5
          unit: "%"
          mode: slider
        - code: "10002"
          name: SOC lower limit
          min: 0
          max: 50
          step: 5
          unit: "%"
          mode: slider
        - code: "10005"
          name: Charging/discharging power
          min: 0
          max: 30
          step: 0.01
          unit: kW
          category: null
        - code: "10071"
          name: Forced charging target SOC 1
          min: 0
          max: 100
          step: 5
          unit: "%"
          mode: slider
        - code: "10076"
          name: Forced charging target SOC 2
          min: 0
          max: 100
          step: 5
          unit: "%"
          mode: slider
        - code: "10091"
          name: Max charging power
          min: 0
          max: 30
          step: 0.01
          unit: kW
        - code: "10092"
          name: Max discharging power
          min: 0
          max: 30
          step: 0.01
          unit: kW
        - code: "10008"
          name: Active power limit ratio
          min: 0
          max: 100
          step: 1
          unit: "%"
          mode: slider
          category: null
        - code: "10013"
          name: Feed-in power limit
          min: 0
          max: 30
          step: 0.01
          unit: kW
