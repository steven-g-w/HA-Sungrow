# catalog.yaml — single source of truth for the API→HA mapping.
# See docs/declarative-catalog-design.md for the schema.
version: 1

# API unit string -> HA unit constant. Unmapped API units pass
# through verbatim (e.g. currency codes on income sensors).
unit_map:
  "W": W
  "kW": kW
  "MW": MW
  "Wh": Wh
  "kWh": kWh
  "MWh": MWh
  "%": "%"
  "℃": °C
  "°C": °C
  "h": h
  "H": h
  "V": V
  "mV": mV
  "A": A
  "kg": kg

device_types:
